# Tool settings

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: overfit / multi-step training tests"]

[tool.ruff]
line-length = 100           # ruff already skips everything in .gitignore

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]   # defaults + import sorting + likely bugs